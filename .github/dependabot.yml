version: 2
# Monthly, minor and patch versions only, one grouped pull request per ecosystem. Major versions are
# updated by hand; known vulnerabilities are caught every week by .github/workflows/audit.yml.
updates:
  - package-ecosystem: cargo
    directories: ["/", "/app/src-tauri"]
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      rust:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      app:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
