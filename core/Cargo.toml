[package]
name = "rigbrew-core"
description = "Rigbrew core: hardware scan, model selection, downloads, engines"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sysinfo = "0.40"
dirs = "7"
rusqlite = { version = "0.43", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v7"] }
reqwest = { version = "0.13", features = ["stream", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "time", "process"] }
futures-util = "0.3"
sha2 = "0.11"
minisign-verify = "0.3"
flate2 = "1"
tar = "0.4"
